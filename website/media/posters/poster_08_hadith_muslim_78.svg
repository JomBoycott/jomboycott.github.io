<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="45%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#041d1a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131c31" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0c1322" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="blueHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bgGrad)" />

  <!-- Grid decoration -->
  <path d="M 0,200 L 1080,200 M 0,400 L 1080,400 M 0,600 L 1080,600 M 0,800 L 1080,800 M 0,1000 L 1080,1000" stroke="#1e293b" stroke-width="1" stroke-opacity="0.25" />
  <path d="M 200,0 L 200,1350 M 400,0 L 400,1350 M 600,0 L 600,1350 M 800,0 L 800,1350 M 1000,0 L 1000,1350" stroke="#1e293b" stroke-width="1" stroke-opacity="0.25" />

  <!-- Ambient Glow -->
  <circle cx="950" cy="180" r="280" fill="#059669" opacity="0.10" />
  <circle cx="100" cy="1150" r="320" fill="#0284c7" opacity="0.08" />

  <!-- Top Header Bar -->
  <rect x="70" y="55" width="940" height="42" rx="8" fill="#1e293b" fill-opacity="0.65" stroke="#334155" stroke-width="1" />
  <text x="95" y="82" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="700" fill="#10b981" letter-spacing="2">CAMPAIGN LEAFLET #08</text>
  <text x="985" y="82" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="1">CALL TO ACTION • THE DEVELOPER&#x27;S HAND</text>

  <!-- Title Section -->
  <text x="70" y="150" font-family="IBM Plex Sans, sans-serif" font-size="38" font-weight="800" fill="#f8fafc">Changing Wrong with Hand &amp; Code</text>
  <text x="70" y="188" font-family="IBM Plex Sans, sans-serif" font-size="19" font-weight="600" fill="#38bdf8">Sahih Muslim (78) &amp; The Actionable Duty of Technologists</text>

  <!-- Arabic Box (Arabic rendered on top via Pango composite at y=285) -->
  <rect x="70" y="222" width="940" height="225" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.8" stroke-opacity="0.4" />
  <text x="980" y="260" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="700" fill="#10b981" text-anchor="end" letter-spacing="1.5">HADITH SHARIF • SAHIH MUSLIM (78)</text>

  <!-- Translations Box -->
  <rect x="70" y="468" width="940" height="262" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
  
  <!-- English -->
  <text x="100" y="504" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">ENGLISH TRANSLATION</text>
  <text x="100" y="538" font-family="IBM Plex Sans, sans-serif" font-size="20" font-weight="500" fill="#f8fafc">The Prophet (s.a.w.) said: &quot;Whoever among you sees an evil, let him change it with his hand;</text>
  <text x="100" y="568" font-family="IBM Plex Sans, sans-serif" font-size="20" font-weight="700" fill="#f43f5e">if he cannot, then with his tongue; if he cannot, then with his heart — and that is the weakest of faith.&quot;</text>
  

  <!-- Divider -->
  <line x1="100" y1="610" x2="980" y2="610" stroke="#1e293b" stroke-width="1" />

  <!-- Malay -->
  <text x="100" y="638" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="700" fill="#10b981" letter-spacing="1.5">TERJEMAHAN BAHASA MELAYU</text>
  <text x="100" y="668" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">Sabda Rasulullah (s.a.w.): &quot;Sesiapa antara kamu melihat kemungkaran, ubahlah dengan tangannya;</text>
  <text x="100" y="696" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#fb7185">jika tidak mampu, dengan lidahnya; jika tidak mampu, dengan hatinya — dan itulah selemah-lemah iman.&quot;</text>
  

  <!-- Strategic Tech Context Box -->
  <rect x="70" y="750" width="940" height="395" rx="16" fill="#082f49" fill-opacity="0.35" stroke="#0284c7" stroke-width="1.8" />
  <rect x="70" y="750" width="940" height="44" rx="16" fill="url(#blueHeader)" />
  <text x="100" y="778" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="1.5">THE &#x27;HAND&#x27; OF THE ENGINEER IS THE CODE HE COMMITS</text>

  <!-- Point 1 -->
  <circle cx="105" cy="825" r="5" fill="#38bdf8" />
  <text x="125" y="830" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Procurement Authority is Direct Power (&#x27;Yad&#x27;):</text>
  <text x="125" y="858" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#cbd5e1">For system architects, DevOps engineers, and CIOs, &#x27;changing with the hand&#x27; means</text>
  <text x="125" y="883" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#cbd5e1">canceling cloud instances, refactoring away from proprietary APIs, and deploying</text>

  <!-- Point 2 -->
  <circle cx="105" cy="925" r="5" fill="#38bdf8" />
  <text x="125" y="930" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Boycott is Active Resistance, Not Mere Sentiment:</text>
  <text x="125" y="958" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#cbd5e1">Merely disliking genocide in one&#x27;s heart while continuing to wire millions in tech</text>
  <text x="125" y="983" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#cbd5e1">subscriptions is the weakest state. Real faith manifests in architectural decisions.</text>

  <!-- Directive Banner -->
  <rect x="95" y="1030" width="890" height="92" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="120" y="1060" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="800" fill="#34d399" letter-spacing="1">ACTIONABLE DIRECTIVE FOR CTOs &amp; LEADERS</text>
  <text x="120" y="1094" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Deprovision proprietary Big Tech SaaS; redeploy workloads onto self-hosted open-source clusters</text>

  <!-- Footer -->
  <line x1="70" y1="1170" x2="1010" y2="1170" stroke="#334155" stroke-width="1" />
  <text x="70" y="1210" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="800" fill="#f8fafc" letter-spacing="1">MALAYSIA OPEN-SOURCE &amp; TECH BOYCOTT COALITION</text>
  <text x="70" y="1238" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#94a3b8">Digital Sovereignty • Ethical Computing • Islamic Accountability</text>
  
  <rect x="770" y="1190" width="240" height="42" rx="8" fill="url(#emeraldGrad)" />
  <text x="890" y="1217" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">DOWNLOAD &amp; SHARE</text>
  
  <text x="70" y="1290" font-family="IBM Plex Mono, monospace" font-size="13" fill="#64748b">http://localhost:9191 • campaign/posters/poster_08_hadith_muslim_78.png</text>
</svg>
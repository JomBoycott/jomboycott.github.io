  <text x="125" y="830" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Technology Built for Tyranny is Inherently Corrupt:</text>
  <text x="125" y="858" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#cbd5e1">Facial recognition checkpoints, biometric databases of occupied populations, and</text>

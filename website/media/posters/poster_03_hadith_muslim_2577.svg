  <text x="100" y="538" font-family="IBM Plex Sans, sans-serif" font-size="20" font-weight="500" fill="#f8fafc">Allah the Almighty says: &quot;O My servants! I have forbidden oppression for</text>
  <text x="100" y="568" font-family="IBM Plex Sans, sans-serif" font-size="20" font-weight="700" fill="#f43f5e">Myself and have made it forbidden amongst you, so do not oppress one another.&quot;</text>
  


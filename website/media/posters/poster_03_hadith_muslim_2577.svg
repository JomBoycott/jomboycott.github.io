  <text x="125" y="930" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">The Developer&#x27;s Moral Boundary:</text>
  <text x="125" y="958" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#cbd5e1">Muslim tech founders, engineers, and procurement committees cannot remain indifferent.</text>
  <text x="125" y="983" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#cbd5e1">Deploying code or paying servers that power oppression violates divine law.</text>


  <text x="100" y="668" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">Firman Allah Taala: &quot;Wahai hamba-hamba-Ku, sesungguhnya Aku telah mengharamkan</text>

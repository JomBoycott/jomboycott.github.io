<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="45%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#041d1a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131c31" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0c1322" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="blueHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bgGrad)" />

  <!-- Grid decoration -->
  <path d="M 0,200 L 1080,200 M 0,400 L 1080,400 M 0,600 L 1080,600 M 0,800 L 1080,800 M 0,1000 L 1080,1000" stroke="#1e293b" stroke-width="1" stroke-opacity="0.25" />
  <path d="M 200,0 L 200,1350 M 400,0 L 400,1350 M 600,0 L 600,1350 M 800,0 L 800,1350 M 1000,0 L 1000,1350" stroke="#1e293b" stroke-width="1" stroke-opacity="0.25" />

  <!-- Ambient Glow -->
  <circle cx="950" cy="180" r="280" fill="#059669" opacity="0.10" />
  <circle cx="100" cy="1150" r="320" fill="#0284c7" opacity="0.08" />

  <!-- Top Header Bar -->
  <rect x="70" y="55" width="940" height="42" rx="8" fill="#1e293b" fill-opacity="0.65" stroke="#334155" stroke-width="1" />
  <text x="95" y="82" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="700" fill="#10b981" letter-spacing="2">CAMPAIGN LEAFLET #01</text>
  <text x="985" y="82" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="1">SHARIAH PRINCIPLE • COMPLICITY</text>

  <!-- Title Section -->
  <text x="70" y="150" font-family="IBM Plex Sans, sans-serif" font-size="38" font-weight="800" fill="#f8fafc">Forbidding Complicity in Sin</text>
  <text x="70" y="188" font-family="IBM Plex Sans, sans-serif" font-size="19" font-weight="600" fill="#38bdf8">Surah Al-Ma&#x27;idah (5:2) &amp; Cloud Infrastructure Divestment</text>

  <!-- Arabic Box (Arabic rendered on top via Pango composite at y=285) -->
  <rect x="70" y="222" width="940" height="225" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.8" stroke-opacity="0.4" />
  <text x="980" y="260" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="700" fill="#10b981" text-anchor="end" letter-spacing="1.5">AL-QUR&#x27;AN AL-KAREEM • SURAH AL-MA&#x27;IDAH (5:2)</text>

  <!-- Translations Box -->
  <rect x="70" y="468" width="940" height="262" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
  
  <!-- English -->
  <text x="100" y="504" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">ENGLISH TRANSLATION</text>
  <text x="100" y="538" font-family="IBM Plex Sans, sans-serif" font-size="20" font-weight="500" fill="#f8fafc">&quot;And cooperate in righteousness and piety, but do not cooperate in</text>
  <text x="100" y="568" font-family="IBM Plex Sans, sans-serif" font-size="20" font-weight="700" fill="#f43f5e">sin and aggression. And fear Allah; indeed, Allah is severe in penalty.&quot;</text>
  

  <!-- Divider -->
  <line x1="100" y1="610" x2="980" y2="610" stroke="#1e293b" stroke-width="1" />

  <!-- Malay -->
  <text x="100" y="638" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="700" fill="#10b981" letter-spacing="1.5">TERJEMAHAN BAHASA MELAYU</text>
  <text x="100" y="668" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">&quot;Dan tolong-menolonglah kamu dalam kebajikan dan ketaqwaan, dan janganlah</text>
  <text x="100" y="696" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#fb7185">kamu tolong-menolong dalam berbuat dosa dan permusuhan / pencerobohan.&quot;</text>
  

  <!-- Strategic Tech Context Box -->
  <rect x="70" y="750" width="940" height="395" rx="16" fill="#082f49" fill-opacity="0.35" stroke="#0284c7" stroke-width="1.8" />
  <rect x="70" y="750" width="940" height="44" rx="16" fill="url(#blueHeader)" />
  <text x="100" y="778" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="1.5">WHY MUSLIM TECH LEADERS &amp; ENTERPRISES MUST BOYCOTT</text>

  <!-- Point 1 -->
  <circle cx="105" cy="825" r="5" fill="#38bdf8" />
  <text x="125" y="830" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Cloud Subscriptions Directly Fund Weaponized Infrastructure:</text>
  <text x="125" y="858" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#cbd5e1">Enterprise cloud spend on Google Cloud and AWS directly finances joint military AI</text>
  <text x="125" y="883" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#cbd5e1">surveillance ecosystems (e.g. Project Nimbus), used for automated warfare and</text>

  <!-- Point 2 -->
  <circle cx="105" cy="925" r="5" fill="#38bdf8" />
  <text x="125" y="930" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Commercial Contracts Constitute Direct Cooperation (&#x27;I&#x27;anah):</text>
  <text x="125" y="958" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#cbd5e1">Classical jurisprudence (Al-Qurtubi, Ibn Taymiyyah) dictates that financial dealings</text>
  <text x="125" y="983" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#cbd5e1">which strengthen an oppressor&#x27;s capacity to commit violence are strictly prohibited</text>

  <!-- Directive Banner -->
  <rect x="95" y="1030" width="890" height="92" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="120" y="1060" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="800" fill="#34d399" letter-spacing="1">ACTIONABLE DIRECTIVE FOR CTOs &amp; LEADERS</text>
  <text x="120" y="1094" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Audit third-party cloud dependencies • Migrate workloads to Sovereign / FOSS infrastructure</text>

  <!-- Footer -->
  <line x1="70" y1="1170" x2="1010" y2="1170" stroke="#334155" stroke-width="1" />
  <text x="70" y="1210" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="800" fill="#f8fafc" letter-spacing="1">MALAYSIA OPEN-SOURCE &amp; TECH BOYCOTT COALITION</text>
  <text x="70" y="1238" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#94a3b8">Digital Sovereignty • Ethical Computing • Islamic Accountability</text>
  
  <rect x="770" y="1190" width="240" height="42" rx="8" fill="url(#emeraldGrad)" />
  <text x="890" y="1217" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">DOWNLOAD &amp; SHARE</text>
  
  <text x="70" y="1290" font-family="IBM Plex Mono, monospace" font-size="13" fill="#64748b">http://localhost:9191 • campaign/posters/poster_01_quran_5_2.png</text>
</svg>